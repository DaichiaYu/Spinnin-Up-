name: Repository guardrails

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository contract tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate exercise data
        run: python3 tools/validate.py

      - name: Rebuild generated exercise figures
        run: python3 tools/build_figures.py

      - name: Rebuild exercise catalog
        run: python3 tools/build_catalog.py

      - name: Ensure generated files are committed and reproducible
        run: git diff --exit-code -- assets/exercises catalog.html
