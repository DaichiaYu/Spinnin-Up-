name: Repository guardrails

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run repository contract tests
        run: python3 -m unittest discover -s tests -v

      - name: Run JavaScript logic tests (no npm dependencies)
        run: node --test tests/js/*.test.mjs

      - name: Validate exercise data
        run: python3 tools/validate.py

      - name: Validate exercise library foundation
        run: python3 tools/validate_exercise_library.py

      - name: Rebuild generated exercise figures
        run: python3 tools/build_figures.py

      - name: Rebuild exercise catalog
        run: python3 tools/build_catalog.py

      - name: Rebuild exercise library coverage report
        run: python3 tools/build_exercise_coverage.py

      - name: Ensure generated files are committed and reproducible
        run: git diff --exit-code -- assets/exercises catalog.html docs/exercise-coverage.md
