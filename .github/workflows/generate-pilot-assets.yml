name: Generate pilot exercise assets
on:
  push:
    branches:
      - recovery-condition-intent-pilot

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild figures, catalog and coverage on feature branch
        run: |
          python3 tools/build_figures.py
          python3 tools/build_catalog.py
          python3 tools/build_exercise_coverage.py
      - name: Commit generated files only if changed
        run: |
          git add assets/exercises/ catalog.html docs/exercise-coverage.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: regenerate mobility exercise figures and catalog'
          git push origin HEAD:recovery-condition-intent-pilot
